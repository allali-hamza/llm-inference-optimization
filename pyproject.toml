    { name = "allali-hamza", email = "hamzaallali7002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "altair>=6.3.0",
    "fastapi[standard]>=0.162.5",
    "huggingface-hub>=2.4.0",
